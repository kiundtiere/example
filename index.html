<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KI und Tiere – Vergleich</title>
<style>
:root{--ink:#161616;--paper:#F4F4F2;--acc:#E9BE45;--bar:#161616}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bar:#F1F1EE}}
:root[data-theme="dark"]{--bar:#F1F1EE}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#141A19;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.stage{position:fixed;inset:0}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#fff}
#right{z-index:1}
#left{z-index:2;clip-path:inset(0 calc(100% - var(--x,50%)) 0 0)}
.cover{position:absolute;inset:0;z-index:5;display:none;cursor:ew-resize}
.dragging .cover{display:block}
.divider{position:absolute;top:0;bottom:0;left:var(--x,50%);z-index:6;width:0;pointer-events:none}
.divider::before{content:"";position:absolute;top:0;bottom:0;left:-1.5px;width:3px;background:var(--acc);box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.knob{position:absolute;top:50%;left:0;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;background:var(--acc);border:3px solid #161616;display:grid;place-items:center;cursor:ew-resize;pointer-events:auto;touch-action:none;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.knob:focus-visible{outline:3px solid #fff;outline-offset:3px}
.knob svg{width:26px;height:26px}
.tag{position:absolute;bottom:76px;z-index:7;font:700 12px/1 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase;padding:8px 10px;pointer-events:none;transition:opacity .2s}
.tag.l{left:14px;background:#161616;color:#F4F4F2}
.tag.r{right:14px;background:var(--acc);color:#161616}
.bar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:8;display:flex;gap:6px;padding:6px;border-radius:999px;background:rgba(22,22,22,.86);backdrop-filter:blur(6px)}
.bar button{border:0;border-radius:999px;padding:9px 14px;min-height:40px;font:600 13px system-ui,sans-serif;background:transparent;color:#F4F4F2;cursor:pointer}
.bar button[aria-pressed="true"]{background:var(--acc);color:#161616}
.bar label{display:flex;align-items:center;gap:6px;color:#F4F4F2;font:600 13px system-ui,sans-serif;padding:0 10px}
@media (max-width:560px){.bar button{padding:8px 10px;font-size:12px}.bar label span{display:none}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <iframe id="right" title="Verspielter Entwurf" src="index.html"></iframe>
  <iframe id="left" title="Phucs Struktur" src="phuc.html"></iframe>
  <div class="cover" aria-hidden="true"></div>
  <span class="tag l" id="tagL">Phucs Struktur</span>
  <span class="tag r" id="tagR">Verspielter Entwurf</span>
  <div class="divider" id="divider">
    <button class="knob" id="knob" role="slider" aria-label="Trennlinie: links Phucs Struktur, rechts der verspielte Entwurf" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" aria-valuetext="50 Prozent Phucs Struktur">
      <svg viewBox="0 0 26 26" aria-hidden="true"><path d="M9 7 L3 13 L9 19 M17 7 L23 13 L17 19" fill="none" stroke="#161616" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
</div>
<div class="bar" role="group" aria-label="Ansicht wählen">
  <button data-to="0">Nur verspielt</button>
  <button data-to="50" aria-pressed="true">Gemischt</button>
  <button data-to="100">Nur Phuc</button>
  <label><input type="checkbox" id="sync" checked> <span>Scrollen koppeln</span></label>
</div>
<script>
(() => {
  const stage = document.getElementById('stage'), knob = document.getElementById('knob'), L = document.getElementById('left'), R = document.getElementById('right');
  let x = 50;
  const set = v => {
    x = Math.max(0, Math.min(100, v));
    stage.style.setProperty('--x', x + '%');
    knob.setAttribute('aria-valuenow', Math.round(x));
    knob.setAttribute('aria-valuetext', Math.round(x) + ' Prozent Phucs Struktur');
    document.getElementById('tagL').style.opacity = x < 8 ? 0 : 1;
    document.getElementById('tagR').style.opacity = x > 92 ? 0 : 1;
    document.querySelectorAll('.bar [data-to]').forEach(b => b.setAttribute('aria-pressed', +b.dataset.to === Math.round(x)));
    L.style.pointerEvents = x < 1 ? 'none' : '';
  };
  const fromEvent = e => set((e.clientX / innerWidth) * 100);
  knob.addEventListener('pointerdown', e => { e.preventDefault(); knob.setPointerCapture(e.pointerId); stage.classList.add('dragging'); fromEvent(e); });
  knob.addEventListener('pointermove', e => { if(stage.classList.contains('dragging')) fromEvent(e); });
  const stop = () => stage.classList.remove('dragging');
  knob.addEventListener('pointerup', stop); knob.addEventListener('pointercancel', stop);
  knob.addEventListener('keydown', e => {
    const step = e.shiftKey ? 10 : 2;
    if(e.key === 'ArrowLeft'){ e.preventDefault(); set(x - step); }
    if(e.key === 'ArrowRight'){ e.preventDefault(); set(x + step); }
    if(e.key === 'Home'){ e.preventDefault(); set(0); }
    if(e.key === 'End'){ e.preventDefault(); set(100); }
  });
  document.querySelectorAll('.bar [data-to]').forEach(b => b.addEventListener('click', () => set(+b.dataset.to)));

  /* Scrollen koppeln: beide Seiten bleiben ungefähr an derselben Stelle (anteilig) */
  let lock = false;
  const sync = (from, to) => {
    if(lock || !document.getElementById('sync').checked) return;
    try {
      const a = from.contentWindow, b = to.contentWindow;
      const fa = a.document.scrollingElement, fb = b.document.scrollingElement;
      const ma = fa.scrollHeight - a.innerHeight, mb = fb.scrollHeight - b.innerHeight;
      if(ma <= 0) return;
      lock = true; fb.scrollTop = (fa.scrollTop / ma) * Math.max(0, mb);
      requestAnimationFrame(() => { lock = false; });
    } catch(err) { /* andere Herkunft: kein Koppeln möglich */ }
  };
  const hook = (f, other) => f.addEventListener('load', () => { try { f.contentWindow.addEventListener('scroll', () => sync(f, other), {passive:true}); } catch(err) {} });
  hook(L, R); hook(R, L);
  set(50);
})();
</script>
</body>
</html>
